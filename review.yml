actions:
  apisYmlUpdated: true
  reason: |
    Documented three API entries (scripted pronunciation assessment, realtime
    streaming, unscripted assessment) with real base URLs, a real OpenAPI for
    the two batch HTTP endpoints, and accurate auth. Plans/rate-limits/finops
    captured published per-15s pricing but left reconciled:false because
    production access is partner/sales-assisted and detailed quotas/schemas are
    not public. No request/response schemas were fabricated.
